name: Build iOS IPA Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build IPA Archive
        run: |
          node package-ipa.js

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HBcoffee-iOS-IPA
          path: HBcoffee.ipa
